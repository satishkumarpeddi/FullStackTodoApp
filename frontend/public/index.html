<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
</head>
<body>
    <h1>Todo List</h1>
    <h3>To Add Todo</h3>
    <div>
        <input id="title" type="text" placeholder="title">
        <input id="description" type="text" placeholder="description">
        <button onclick="addTodo()">Add Todo</button>
    </div>
    <h3>To Fetch Todo</h3>
    <div>
        <button onclick="getTodos()">Get Todo</button>
    </div>
    <div id="list">

    </div>
</body>
<script>
    let todos = []
    const fetchUtilMethod = async() =>{
        const respone = await fetch("http://localhost:3000/todos",{
            method:"GET"
        });
        const data = await respone.json();
        todos = data;
    }
    const addTodo = async () => {
        const titleField = document.querySelector("#title");
        const descriptionField = document.querySelector("#description")

        if(!titleField || !descriptionField){
            alert("Required input fields are missing from the DOM.")
            return;
        }
        try{
                const response = await fetch("http://localhost:3000/todos",{
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        title:titleField.value,
                        description:descriptionField.value
                    })
                })
            if(response.ok){
                alert("Adding successfully");
                titleField.value='';
                descriptionField.value=''
            }
        }catch(err){
            console.error("Network error:"+err);
            alert("Failed to connect to the server.")
        }
    }
    const getTodos = () => {
        const element = document.querySelector("#list");
        // element.remove()
        for(let i=0;i<todos.length;i++){
            const divTag = document.createElement("div");
            const h4Tag = document.createElement("h4");
            const span = document.createElement("span");
            h4Tag.innerText = todos[i].title;
            span.innerText = todos[i].description;
            divTag.appendChild(h4Tag);
            divTag.appendChild(span);
            element.appendChild(divTag)
        }
    }
    fetchUtilMethod();
</script>
</html>
